<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Welcome to NovaByte — Our Workplace</title>
<style>
@font-face{font-family:"Anton";src:url(assets/fonts/anton-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Mono";src:url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2");font-weight:700}
:root{--gold:#ffc83d;--ink:#050608}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);overflow:hidden;color:#fff;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}

#media{position:fixed;inset:0;overflow:hidden;background:#000}
#media img,#media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;will-change:transform,opacity,filter}
#media video{z-index:2}
#shade{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.18) 30%,rgba(0,0,0,0) 48%,rgba(0,0,0,.25) 64%,rgba(0,0,0,.82) 100%)}
#vignette{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 22vmin rgba(0,0,0,.55)}

/* TikTok layout: big centered title on top, three columns at the bottom */
.slide{position:fixed;inset:0;z-index:5;display:none;pointer-events:none}
.slide.on{display:block}
.top{position:absolute;top:6.5vh;left:0;right:0;text-align:center;padding:0 4vw}
.kicker{font-family:"Mono",monospace;font-size:clamp(11px,.95vw,15px);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:1.6vh}
.title{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.95;letter-spacing:.01em;
  font-size:clamp(44px,7.4vw,132px);text-shadow:0 4px 40px rgba(0,0,0,.45)}
.title .w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em}
.title .w>span{display:inline-block}
.bottom{position:absolute;left:0;right:0;bottom:7vh;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3.2vw;padding:0 6vw;max-width:1500px;margin:0 auto}
.col{border-top:2px solid rgba(255,255,255,.85);padding-top:1.5vh}
.col .lbl{font-family:"Mono",monospace;font-size:clamp(10px,.8vw,13px);letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:1vh}
.col .txt{font-weight:600;font-size:clamp(16px,1.55vw,27px);line-height:1.3;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.col .big{font-family:"Anton",sans-serif;font-size:clamp(34px,3.6vw,64px);line-height:1;color:var(--gold);margin-bottom:.6vh}
.p{color:var(--gold);white-space:nowrap}

/* schedule */
.week{position:absolute;left:50%;top:50%;transform:translate(-50%,-44%);width:min(1080px,84vw);
  display:grid;grid-template-columns:56px repeat(5,1fr);grid-template-rows:34px repeat(10,minmax(0,1fr));height:min(46vh,430px);
  background:rgba(5,6,8,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:10px 14px 12px}
.week .d{grid-row:1;font-family:"Mono",monospace;font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.7);padding-left:6px;align-self:center}
.week .h{grid-column:1;font-family:"Mono",monospace;font-size:11px;color:rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.1);padding-top:2px}
.week .c{border-top:1px solid rgba(255,255,255,.1);border-left:1px solid rgba(255,255,255,.1)}
.ev{margin:2px 4px;border-radius:3px;padding:4px 8px;font-family:"Mono",monospace;font-size:clamp(9px,.72vw,12px);font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;z-index:1;overflow:hidden}
.ev small{display:block;font-weight:400;opacity:.8}
.ev.g{background:var(--gold);color:#111}.ev.w{background:#fff;color:#111}.ev.o{border:1.5px dashed rgba(255,255,255,.75)}.ev.r{background:#ff4d3d;color:#fff}

.hud{position:fixed;z-index:8;font-family:"Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.75)}
#brand{top:2.6vh;left:3vw}#brand b{color:var(--gold)}
#count{top:2.6vh;right:3vw}
#speaker{bottom:2.2vh;left:3vw}
#hint{bottom:2.2vh;right:3vw;opacity:.55}
#bar{position:fixed;z-index:8;left:0;bottom:0;height:3px;background:var(--gold);width:0}

@media (max-width:760px){
  .bottom{grid-template-columns:1fr;gap:12px;bottom:6vh}
  .col .txt{font-size:16px}
  .week{width:94vw;height:40vh;padding:6px}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="media"></div>
<div id="load" style="position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;font:700 10px Mono,monospace;letter-spacing:.2em;color:#ffc83d;pointer-events:none">LOADING VIDEO 0%</div>
<div id="shade"></div><div id="vignette"></div>
<main id="slides"></main>
<div class="hud" id="brand"><b>■</b> NovaByte · Orientation</div>
<div class="hud" id="count">01 / 13</div>
<div class="hud" id="speaker">Speaker 1</div>
<div class="hud" id="hint">→ next · ← back · F fullscreen</div>
<div id="bar"></div>

<script src="assets/gsap.min.js"></script>
<script>
/* ===== EDIT: group names ===== */
const SPEAKERS = ["Speaker 1","Speaker 2","Speaker 3","Speaker 4","Speaker 5"];
/* ============================== */

const S = "assets/scenes/";
// bg: scene under the text. via: AI camera move played as the transition INTO this slide (forward only)
const SLIDES = [
  {sp:0, bg:"00-intro-first", kicker:"Final challenge · Our workplace", title:"Welcome to NovaByte",
   cols:[{big:"8",lbl:"Rooms",txt:"One floor, one corridor"},{big:"25",lbl:"Developers",txt:"A small software company"},{big:"Day 1",lbl:"Today",txt:"A walk around the office"}]},
  {sp:0, bg:"01-reception", via:"videos/00-intro.mp4", kicker:"Room 01", title:"Reception",
   cols:[{lbl:"Where",txt:"When you come in, the reception is [on the left]."},{lbl:"Inside",txt:"The desk is [in front of] the grey sofa."},{lbl:"Tip",txt:"The water cooler is [next to] the sofa."}]},
  {sp:0, bg:"02-waiting", via:"videos/t1.mp4", kicker:"Room 02", title:"Waiting Area",
   cols:[{lbl:"Where",txt:"The waiting area is [behind] the reception."},{lbl:"Inside",txt:"The armchairs are [around] the coffee table."},{lbl:"Tip",txt:"The whiteboard is [on] the wall."}]},
  {sp:1, bg:"03-workstation", via:"videos/t2.mp4", kicker:"Room 03", title:"Main Workstation Hall",
   cols:[{lbl:"Where",txt:"The hall is [at the end of] the corridor, [on the left]."},{lbl:"Inside",txt:"Our developers work [at] these 16 desks."},{lbl:"Tip",txt:"The printer is [under] the window."}]},
  {sp:1, bg:"04-boss-cabin", via:"videos/t3.mp4", kicker:"Room 04", title:"Boss Cabin",
   cols:[{lbl:"Where",txt:"The Boss Cabin is [opposite] the Workstation Hall."},{lbl:"Inside",txt:"The bookshelf is [behind] the meeting table."},{lbl:"Tip",txt:"Our CEO works [in] this office."}]},
  {sp:2, bg:"05-accounts", via:"videos/t4.mp4", kicker:"Room 05", title:"Accounts",
   cols:[{lbl:"Where",txt:"Accounts is [across from] the waiting area."},{lbl:"Inside",txt:"The two desks are [next to] each other."},{lbl:"Tip",txt:"Ask here [about] your salary."}]},
  {sp:2, bg:"06-staff-room", via:"videos/t5.mp4", kicker:"Room 06", title:"Staff Room",
   cols:[{lbl:"Where",txt:"It is [between] Accounts and the Centre Head."},{lbl:"Inside",txt:"The coffee machine is [on] the shelf."},{lbl:"Tip",txt:"The water cooler is [near] the door."}]},
  {sp:3, bg:"07-centre-head", via:"videos/t6.mp4", kicker:"Room 07", title:"Centre Head",
   cols:[{lbl:"Where",txt:"This office is [below] the Staff Room."},{lbl:"Inside",txt:"The bookshelf is [on the left]."},{lbl:"Tip",txt:"Our Head of Technology works [in] this office."}]},
  {sp:3, bg:"08-counsellor", via:"videos/t7.mp4", kicker:"Room 08", title:"Counsellor Room",
   cols:[{lbl:"Where",txt:"It is [next to] the main entrance."},{lbl:"Inside",txt:"The small table is [between] the two armchairs."},{lbl:"Tip",txt:"Talk to HR here [about] any problem."}]},
  {sp:3, bg:"00-intro-first", via:"videos/99-outro.mp4", kicker:"How to move around", title:"Find your way",
   cols:[{lbl:"Step 1",txt:"Come in [through] the glass door."},{lbl:"Step 2",txt:"Walk [along] the corridor. The offices are [on the right]."},{lbl:"Step 3",txt:"The Workstation Hall is [at the end of] the corridor."}]},
  {sp:4, bg:"00-intro-first", dim:true, week:true, kicker:"Part 2 · Our weekly schedule", title:"A week at NovaByte",
   cols:[{lbl:"Monday",txt:"Team meetings are [on] Mondays [at] 9 a.m."},{lbl:"Every day",txt:"We have lunch [at] noon [in] the Staff Room."},{lbl:"Tuesday",txt:"Coding training is [in] the afternoon."}]},
  {sp:4, bg:"00-intro-first", dim:true, week:true, kicker:"Part 2 · Our weekly schedule", title:"A week at NovaByte",
   cols:[{lbl:"Rule",txt:"No phones [during] the training, please!"},{lbl:"Thursday",txt:"Code review is [before] lunch."},{lbl:"Friday",txt:"We work [until] 6 p.m. [After] the deadline, we play video games!"}]},
  {sp:4, bg:"01-reception", kicker:"See you on Monday at 9 a.m.", title:"Welcome to the team!",
   cols:[{big:"?",lbl:"Questions",txt:"Any questions?"},{big:"9:00",lbl:"Monday",txt:"Your first team meeting [at] 9 a.m."},{big:"☕",lbl:"Before that",txt:"Coffee [in] the Staff Room."}]}
];
const EVENTS = [[0,9,10,"Team meeting","Boss Cabin","g"],[1,14,16,"Coding training","Workstation Hall","w"],
  [3,11,12,"Code review","Centre Head","w"],[4,16,17,"Deadline","Before 5 p.m.","r"],[4,17,18,"Video games","After the deadline","g"],
  ...[0,1,2,3,4].map(d=>[d,12,13,"Lunch","Staff Room","o"])];

/* ---------- build ---------- */
const $ = s=>document.querySelector(s), pad=n=>String(n).padStart(2,"0");
const fmt = t=>t.replace(/\[([^\]]+)\]/g,'<span class="p">$1</span>');
const words = t=>t.split(" ").map(w=>`<span class="w"><span>${w}</span></span>`).join(" ");
function weekHTML(){
  let h='<div class="week"><div></div>'+["MON","TUE","WED","THU","FRI"].map((d,i)=>`<div class="d" style="grid-column:${i+2}">${d}</div>`).join("");
  for(let r=0;r<10;r++){ h+=`<div class="h" style="grid-row:${r+2}">${9+r}:00</div>`; for(let c=0;c<5;c++) h+=`<div class="c" style="grid-row:${r+2};grid-column:${c+2}"></div>`; }
  EVENTS.forEach(([d,s,e,l,p,k])=>h+=`<div class="ev ${k}" style="grid-column:${d+2};grid-row:${s-7}/${e-7}">${l}<small>${p}</small></div>`);
  return h+'</div>';
}
const media=$("#media"), imgs={}, VQ=[];
SLIDES.forEach(s=>{
  if(!imgs[s.bg]){ const im=new Image(); im.src=S+s.bg+".jpg"; im.alt=""; media.appendChild(im); imgs[s.bg]=im; }
  if(s.via){ const v=document.createElement("video"); v.muted=true; v.playsInline=true; v.preload="auto"; VQ.push([v,s.via]);
    s.ready=new Promise(r=>v.addEventListener("loadeddata",()=>{s.vid=v;r(v)},{once:true})); media.appendChild(v); }
  const el=document.createElement("section"); el.className="slide";
  el.innerHTML=`<div class="top"><div class="kicker">${s.kicker}</div><h1 class="title">${words(s.title)}</h1></div>
    ${s.week?weekHTML():""}
    <div class="bottom">${s.cols.map(c=>`<div class="col">${c.big?`<div class="big">${c.big}</div>`:""}<div class="lbl">${c.lbl}</div><div class="txt">${fmt(c.txt)}</div></div>`).join("")}</div>`;
  $("#slides").appendChild(el); s.el=el;
});

/* ---------- motion ---------- */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur=-1, curImg=null, kb=null, pending=null;
function textIn(s){
  const t=gsap.timeline();
  t.fromTo(s.el.querySelector(".kicker"),{opacity:0,y:-10},{opacity:1,y:0,duration:.5,ease:"power2.out"})
   .fromTo(s.el.querySelectorAll(".title .w>span"),{yPercent:110},{yPercent:0,duration:.8,ease:"expo.out",stagger:.07},"-=.3")
   .fromTo(s.el.querySelectorAll(".col"),{opacity:0,y:30},{opacity:1,y:0,duration:.7,ease:"expo.out",stagger:.12},"-=.45");
  const evs=s.el.querySelectorAll(".ev");
  if(evs.length) t.fromTo(s.el.querySelector(".week"),{opacity:0},{opacity:1,duration:.6,ease:"expo.out"},.2)
                  .fromTo(evs,{opacity:0,scaleY:0,transformOrigin:"top"},{opacity:1,scaleY:1,duration:.45,ease:"expo.out",stagger:.05},.5);
}
function showImg(s, how){
  const im=imgs[s.bg]; if(kb) kb.kill();
  const prev=curImg; curImg=im;
  const op = s.dim ? .6 : 1, blur = s.dim ? "blur(6px)" : "blur(0px)";
  gsap.killTweensOf(im); gsap.set(im,{zIndex:1});
  if(prev && prev!==im){ gsap.killTweensOf(prev); gsap.set(prev,{zIndex:0}); }
  if(how==="cut"){
    gsap.set(im,{opacity:op,scale:1,xPercent:0,filter:blur});
    if(prev&&prev!==im) gsap.set(prev,{opacity:0});
  } else if(how==="whip" && prev && prev!==im){
    gsap.to(prev,{xPercent:-16,scale:1.1,filter:"blur(16px)",opacity:0,duration:RM?.01:.5,ease:"power2.in",onComplete:()=>gsap.set(prev,{xPercent:0,scale:1,filter:"blur(0px)"})});
    gsap.fromTo(im,{opacity:0,xPercent:16,scale:1.1,filter:"blur(16px)"},{opacity:op,xPercent:0,scale:1,filter:blur,duration:RM?.01:.8,ease:"expo.out",delay:RM?0:.25});
  } else {
    if(prev&&prev!==im) gsap.to(prev,{opacity:0,duration:.6});
    gsap.fromTo(im,{opacity:prev===im?op:0},{opacity:op,scale:1,xPercent:0,filter:blur,duration:RM?.01:.7,ease:"power2.out"});
  }
  if(!RM) kb=gsap.to(im,{scale:1.07,duration:14,ease:"sine.inOut",yoyo:true,repeat:-1,delay:.9});
}
function enter(s){ SLIDES.forEach(x=>x.el.classList.toggle("on",x===s)); textIn(s); }
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const decoded=im=>im.decode?im.decode().catch(()=>{}):Promise.resolve();
let nav=0;
async function go(n){
  if(n<0||n>=SLIDES.length||n===cur) return;
  const prev=SLIDES[cur], s=SLIDES[n], fwd=n>cur, id=++nav;
  if(pending){ pending(); pending=null; }
  media.querySelectorAll("video").forEach(v=>{ v.pause(); gsap.killTweensOf(v); gsap.set(v,{opacity:0}); });
  cur=n;
  $("#count").textContent=`${pad(n+1)} / ${SLIDES.length}`; $("#speaker").textContent=SPEAKERS[s.sp];
  gsap.to("#bar",{width:((n+1)/SLIDES.length*100)+"%",duration:.6});
  SLIDES.forEach(x=>x.el.classList.remove("on"));
  const useVid = fwd && s.via && !RM;
  if(useVid && !s.vid){            // video still downloading: wait for it (max 10 s), then fall back
    const ld=$("#load"); gsap.set(ld,{opacity:1}); ld.dataset.wait=1;
    await Promise.race([s.ready, wait(10000)]);
    delete ld.dataset.wait; if(ld.textContent==="READY") gsap.to(ld,{opacity:0,duration:.4});
    if(id!==nav) return;           // user moved on meanwhile
  }
  await decoded(imgs[s.bg]);       // landing image ready before the cut (no black flash)
  if(id!==nav) return;
  if(useVid && s.vid){
    const v=s.vid; v.currentTime=0;
    try{ await v.play(); }catch(e){}
    if(id!==nav){ v.pause(); return; }
    gsap.to(v,{opacity:1,duration:.3});
    const land=()=>{ cleanup(); if(id!==nav) return; showImg(s,"cut"); gsap.to(v,{opacity:0,duration:.6}); enter(s); };
    const cleanup=()=>v.removeEventListener("ended",land);
    v.addEventListener("ended",land); pending=cleanup;
  } else {
    showImg(s, prev && fwd ? "whip" : "fade"); enter(s);
  }
}
addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(e.key)){e.preventDefault();go(cur+1)}
  if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==="f"||e.key==="F") document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
});
addEventListener("click",e=>go(cur+(e.clientX<innerWidth*.25?-1:1)));
let tx=null;addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)go(cur+(d<0?1:-1));tx=null});
/* preload: download every video completely into memory so transitions never stall on slow Wi-Fi */
(async()=>{
  const ld=$("#load"), sizes=VQ.map(()=>0), got=VQ.map(()=>0);
  const upd=()=>{ const T=sizes.reduce((a,b)=>a+b,0), G=got.reduce((a,b)=>a+b,0); ld.textContent="LOADING VIDEO "+(T?Math.min(99,Math.floor(G/T*100)):0)+"%"; };
  await Promise.all(VQ.map(async([v,url],i)=>{
    try{
      const r=await fetch(url); if(!r.ok) throw 0; sizes[i]=+r.headers.get("content-length")||0;
      const rd=r.body.getReader(), parts=[];
      for(;;){ const {done,value}=await rd.read(); if(done) break; parts.push(value); got[i]+=value.length; upd(); }
      v.src=URL.createObjectURL(new Blob(parts,{type:"video/mp4"}));
    }catch(e){ v.src=url; }
  }));
  ld.textContent="READY"; if(!ld.dataset.wait) gsap.to(ld,{opacity:0,delay:1.2,duration:.6});
})();
(async()=>{                       // start only when fonts + first image are ready
  const n=Math.min(parseInt(location.hash.slice(1))||0,SLIDES.length-1);
  await Promise.all([document.fonts.ready, decoded(imgs[SLIDES[n].bg])]);
  go(n);
})();
</script>
</body>
</html>
